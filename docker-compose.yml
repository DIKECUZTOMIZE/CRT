services:
  redis:
    image: redis:7-alpine
    container_name: crt-redis
    restart: unless-stopped
    expose:
      - "6379"
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction

  mongo:
    image: mongo:7
    container_name: crt-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend-1:
    build:
      context: ./backend-restored
      dockerfile: Dockerfile
    container_name: crt-backend-1
    restart: unless-stopped
    depends_on:
      - redis
      - mongo
    ports:
      - "3000:3000"
    env_file:
      - ./backend-restored/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/crt
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174,http://localhost:5175
      FRONTEND_URL: http://localhost:5173
      ADMIN_FRONTEND_URL: http://localhost:5174
      ORGANIZER_FRONTEND_URL: http://localhost:5175
    command: npm start

  backend-2:
    build:
      context: ./backend-restored
      dockerfile: Dockerfile
    container_name: crt-backend-2
    restart: unless-stopped
    depends_on:
      - redis
      - mongo
    expose:
      - "3000"
    env_file:
      - ./backend-restored/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/crt
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174,http://localhost:5175
      FRONTEND_URL: http://localhost:5173
      ADMIN_FRONTEND_URL: http://localhost:5174
      ORGANIZER_FRONTEND_URL: http://localhost:5175
    command: npm start

  user:
    build:
      context: ./User
      dockerfile: dockerfile
    container_name: crt-user
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -- --host 0.0.0.0 --port 5173

  admin:
    build:
      context: ./admin-restored
      dockerfile: dockerfile
    container_name: crt-admin
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      VITE_API_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -- --host 0.0.0.0 --port 5174

  organizer:
    build:
      context: ./organizer-restored
      dockerfile: dockerfile
    container_name: crt-organizer
    restart: unless-stopped
    ports:
      - "5175:5175"
    environment:
      VITE_API_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -- --host 0.0.0.0 --port 5175

  nginx:
    image: nginx:1.27-alpine
    container_name: crt-nginx
    restart: unless-stopped
    depends_on:
      - backend-1
      - backend-2
      - user
      - admin
      - organizer
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
    command: ["nginx", "-g", "daemon off;"]

volumes:
  mongo_data:

