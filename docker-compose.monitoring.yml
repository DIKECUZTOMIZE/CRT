version: "3.9"

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  monitoring:
    driver: bridge
  crt-test_default:
    external: true

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: crt-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - monitoring
      - crt-test_default

  grafana:
    image: grafana/grafana:11.3.2
    container_name: crt-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
      - crt-test_default

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: crt-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - monitoring
      - crt-test_default

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: crt-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - monitoring
      - crt-test_default

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: crt-redis-exporter
    restart: unless-stopped
    command:
      - --redis.addr=redis://redis:6379
    ports:
      - "127.0.0.1:9121:9121"
    networks:
      - monitoring
      - crt-test_default

  mongodb-exporter:
    image: percona/mongodb_exporter:0.39.0
    container_name: crt-mongodb-exporter
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      MONGODB_URI: mongodb+srv://crt632055_db_user:M9SV9wuTIAA9or1g@cluster0.fkmjpob.mongodb.net/CRT
    command:
      - --mongodb.uri=mongodb+srv://crt632055_db_user:M9SV9wuTIAA9or1g@cluster0.fkmjpob.mongodb.net/CRT
      - --mongodb.direct-connect=false
    ports:
      - "127.0.0.1:9216:9216"
    networks:
      - monitoring
      - crt-test_default
